  <path d="M0 660 L200 660 L250 690 L1350 680 L1400 650 L1600 650 L1600 900 L0 900 Z" fill="url(#bench2)"/>
  <path d="M0 730 L160 730 L220 765 L1380 755 L1440 722 L1600 722 L1600 900 L0 900 Z" fill="url(#bench3)"/>
  <path d="M0 810 L1600 800 L1600 900 L0 900 Z" fill="#14100c"/>
  <!-- haul road -->
  <path d="M1180 900 L1300 760 L1380 690 L1450 640 L1520 600 L1600 585 L1600 600 L1530 620 L1465 660 L1400 710 L1330 775 L1240 900 Z" fill="#6b5545" opacity="0.7"/>
