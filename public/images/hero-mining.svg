    <path d="M30 4 L-60 -70 L-48 -82 L44 -6 Z"/>
    <path d="M-60 -70 L-120 10 L-104 18 L-46 -62 Z"/>
    <path d="M-126 6 L-88 6 L-80 30 L-136 30 Z" fill="#8a0b20"/>
