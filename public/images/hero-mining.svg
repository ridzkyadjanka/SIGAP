<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="0.55" stop-color="#2a3b63"/>
      <stop offset="1" stop-color="#b8643f"/>
    </linearGradient>
    <linearGradient id="bench1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4636"/>
      <stop offset="1" stop-color="#3a2c22"/>
    </linearGradient>
    <linearGradient id="bench2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46362a"/>
      <stop offset="1" stop-color="#2b211a"/>
    </linearGradient>
    <linearGradient id="bench3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f251d"/>
      <stop offset="1" stop-color="#1b1511"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.62" r="0.35">
      <stop offset="0" stop-color="#f6b26b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f6b26b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
